<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quizy - Multi-Language Quiz</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #6c5ce7;
      --accent: #00b894;
      --danger: #ff7675;
      --warning: #fdcb6e;
      --prev-btn: #e17055;
      --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(8px, 2.5vw, 24px);
      position: relative;
      overflow-x: hidden;
    }

    .bg-doodles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      font-size: clamp(1.8rem, 4vw, 4.5rem);
      opacity: 0.12;
      animation: float 8s infinite ease-in-out;
    }

    .doodle:nth-child(1) { top: 8%; left: 6%; animation-delay: 0s; }
    .doodle:nth-child(2) { top: 78%; left: 8%; animation-delay: 2s; }
    .doodle:nth-child(3) { top: 12%; right: 8%; animation-delay: 4s; }
    .doodle:nth-child(4) { top: 82%; right: 10%; animation-delay: 1s; }
    .doodle:nth-child(5) { top: 45%; left: 3%; animation-delay: 3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(8deg); }
    }

    .app-container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: clamp(16px, 2.5vw, 32px);
      padding: clamp(14px, 2.8vw, 32px);
      width: 100%;
      max-width: 920px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      text-align: center;
      color: white;
      margin: auto;
    }

    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 14px;
      border-radius: 18px;
      margin-bottom: clamp(10px, 1.8vw, 16px);
    }

    .lang-buttons { display: flex; gap: 6px; flex-wrap: wrap; }

    .lang-btn {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: clamp(0.8rem, 1.4vw, 1.05rem);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover { background: rgba(255, 255, 255, 0.35); }

    .lang-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d3b2e;
      box-shadow: 0 0 10px rgba(0, 184, 148, 0.6);
    }

    .lang-dropdown-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.85rem, 1.4vw, 1.05rem);
      font-weight: 600;
    }

    .lang-select {
      background: #1e1b4b;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .app-title {
      font-size: clamp(1.6rem, 3.8vw, 3rem);
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: clamp(6px, 1.2vw, 12px);
      background: linear-gradient(45deg, #a855f7, #3b82f6, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .character-container {
      width: clamp(60px, 8.5vw, 105px);
      height: clamp(60px, 8.5vw, 105px);
      margin: 0 auto clamp(8px, 1.5vw, 14px) auto;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: clamp(2px, 0.4vw, 4px) solid rgba(255,255,255,0.4);
      animation: pulseCharacter 3s infinite ease-in-out;
      font-size: clamp(2rem, 4.5vw, 3.6rem);
      user-select: none;
    }

    @keyframes pulseCharacter {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .character-happy {
      animation: celebrate 0.6s ease-in-out infinite alternate;
    }

    @keyframes celebrate {
      0% { transform: translateY(0) scale(1.1); }
      100% { transform: translateY(-12px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: clamp(6px, 1.2vw, 14px);
      font-weight: 700;
      font-size: clamp(0.95rem, 1.8vw, 1.45rem);
    }

    .streak-badge {
      background: rgba(255, 255, 255, 0.25);
      padding: clamp(4px, 0.7vw, 7px) clamp(10px, 1.4vw, 16px);
      border-radius: 20px;
      font-size: clamp(0.85rem, 1.6vw, 1.2rem);
    }

    .timer-container {
      width: 100%;
      height: clamp(8px, 1.1vw, 12px);
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin-bottom: clamp(12px, 2.2vw, 22px);
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 10px;
      transition: width 1s linear, background-color 0.5s ease;
    }

    .card-scene {
      width: 100%;
      min-height: clamp(180px, 25vh, 340px);
      perspective: 1200px;
      margin-bottom: clamp(14px, 2.2vw, 24px);
      cursor: pointer;
    }

    .card {
      width: 100%;
      min-height: clamp(180px, 25vh, 340px);
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: clamp(14px, 2vw, 22px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    .card.is-flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: clamp(14px, 2vw, 22px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 2.5vw, 30px);
      background: white;
      color: #2d3436;
      overflow-y: auto;
    }

    .card-front { border-bottom: clamp(5px, 0.8vw, 10px) solid var(--primary); }
    .card-back { background: #f8f9fa; transform: rotateY(180deg); border-bottom: clamp(5px, 0.8vw, 10px) solid var(--accent); }

    .card-label {
      font-size: clamp(0.75rem, 1.3vw, 1.1rem);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8395a7;
      margin-bottom: clamp(6px, 1vw, 12px);
      font-weight: 700;
    }

    .card-text {
      font-size: clamp(1.15rem, 2.6vw, 2.1rem);
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      word-break: break-word;
    }

    .card-back .card-text {
      color: var(--accent);
      font-size: clamp(1.25rem, 3vw, 2.3rem);
    }

    .button-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 1.5vw, 16px);
    }

    .btn {
      padding: clamp(10px, 1.5vw, 16px) clamp(6px, 1.2vw, 14px);
      border: none;
      border-radius: clamp(10px, 1.4vw, 14px);
      font-size: clamp(0.85rem, 1.5vw, 1.25rem);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      user-select: none;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none; }

    .btn-prev { background: var(--prev-btn); color: white; }
    .btn-prev:hover:not(:disabled) { background: #d63031; }
    .btn-show { background: var(--accent); color: white; }
    .btn-show:hover { background: #00a182; }
    .btn-next { background: #0984e3; color: white; }
    .btn-next:hover { background: #0773c5; }

    .credits-footer {
      margin-top: clamp(12px, 1.8vw, 20px);
      font-size: clamp(0.72rem, 1.2vw, 0.95rem);
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.4;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: clamp(8px, 1.4vw, 14px);
    }

    .credits-footer strong { color: #ffffff; }

    @media (max-width: 580px) {
      .lang-bar { justify-content: center; }
      .button-group { grid-template-columns: 1fr 1fr; }
      .btn-show { grid-column: span 2; order: -1; }
    }
  </style>
</head>
<body>

<div class="bg-doodles">
  <div class="doodle">📚</div>
  <div class="doodle">💡</div>
  <div class="doodle">🎓</div>
  <div class="doodle">✏️</div>
  <div class="doodle">🔬</div>
</div>

<div class="app-container" id="app">
  <div class="lang-bar">
    <div class="lang-buttons">
      <button class="lang-btn active" id="btn-lang-mr" onclick="changeLanguage('mr')">मराठी</button>
      <button class="lang-btn" id="btn-lang-hi" onclick="changeLanguage('hi')">हिन्दी</button>
      <button class="lang-btn" id="btn-lang-en" onclick="changeLanguage('en')">English</button>
    </div>
    <div class="lang-dropdown-container">
      <span>🌐</span>
      <select class="lang-select" id="lang-select" onchange="changeLanguage(this.value)">
        <option value="mr" selected>मराठी (Marathi)</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <h1 class="app-title">Quizy 🧠</h1>
  <div class="character-container" id="student-avatar">🧑‍🎓</div>

  <div class="header">
    <div>⏱️ <span id="timer-text">60</span>s</div>
    <div class="streak-badge">⚡ <span id="lbl-streak">गुण</span>: <span id="streak">0</span></div>
  </div>

  <div class="timer-container">
    <div class="timer-bar" id="timer-bar"></div>
  </div>

  <div class="card-scene" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="card-label" id="lbl-question">प्रश्न</div>
        <div class="card-text" id="question">डेटा लोड होत आहे...</div>
      </div>
      <div class="card-face card-back">
        <div class="card-label" id="lbl-answer">उत्तर</div>
        <div class="card-text" id="answer">-</div>
      </div>
    </div>
  </div>

  <div class="button-group">
    <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()" disabled>⬅️ मागील प्रश्न</button>
    <button class="btn btn-show" id="btn-show" onclick="flipCard()">👁️ उत्तर पाहा</button>
    <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">पुढील प्रश्न ➡️</button>
  </div>

  <div class="credits-footer">
    © <strong>Vrushabh H. Borkar</strong><br>
    <span id="lbl-designation">Graduate Teacher, ZP Upper Primary School, Mohgaon (Tilli)</span>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycby9ijHFBO9SbVTzijnZNRwDzshNpdQuoGhMHXEMndaPl4hXycg-hp_hU3qNZl8FMrqJyQ/exec";

  const uiTranslations = {
    mr: {
      lblQuestion: "प्रश्न (Question)",
      lblAnswer: "उत्तर (Answer)",
      btnPrev: "⬅️ मागील प्रश्न",
      btnShow: "👁️ उत्तर पाहा",
      btnNext: "पुढील प्रश्न ➡️",
      lblStreak: "गुण",
      loading: "डेटा लोड होत आहे...",
      error: "डेटा लोड होऊ शकला नाही. कृपया रिफ्रेश करा.",
      designation: "पदवीधर शिक्षक, जि. प. उच्च प्राथमिक शाळा, मोहगाव (तिल्ली)"
    },
    hi: {
      lblQuestion: "प्रश्न (Question)",
      lblAnswer: "उत्तर (Answer)",
      btnPrev: "⬅️ पिछला प्रश्न",
      btnShow: "👁️ उत्तर देखें",
      btnNext: "अगला प्रश्न ➡️",
      lblStreak: "स्कोर",
      loading: "डेटा लोड हो रहा है...",
      error: "डेटा लोड नहीं हो सका। कृपया पुनः प्रयास करें।",
      designation: "स्नातक शिक्षक, जि. प. उच्च प्राथमिक विद्यालय, मोहगांव (तल्ली)"
    },
    en: {
      lblQuestion: "Question",
      lblAnswer: "Answer",
      btnPrev: "⬅️ Previous",
      btnShow: "👁️ View Answer",
      btnNext: "Next ➡️",
      lblStreak: "Streak",
      loading: "Loading questions...",
      error: "Could not load data. Please refresh.",
      designation: "Graduate Teacher, ZP Upper Primary School, Mohgaon (Tilli)"
    }
  };

  let questionsData = [];
  let unseenPool = [];
  let historyStack = [];
  let currentIndex = -1;
  let currentLanguage = 'mr';
  let timer = 60;
  let timerInterval = null;
  let streak = 0;
  const revealedQuestions = new Set();

  const questionEl = document.getElementById("question");
  const answerEl = document.getElementById("answer");
  const cardEl = document.getElementById("card");
  const timerText = document.getElementById("timer-text");
  const timerBar = document.getElementById("timer-bar");
  const streakEl = document.getElementById("streak");
  const prevBtn = document.getElementById("btn-prev");
  const showBtn = document.getElementById("btn-show");
  const nextBtn = document.getElementById("btn-next");
  const avatar = document.getElementById("student-avatar");
  const langSelect = document.getElementById("lang-select");
  const lblQuestion = document.getElementById("lbl-question");
  const lblAnswer = document.getElementById("lbl-answer");
  const lblStreak = document.getElementById("lbl-streak");
  const lblDesignation = document.getElementById("lbl-designation");

  function normalizeApiResponse(rawItems) {
    if (!Array.isArray(rawItems)) return [];
    const parsed = [];

    // Check if the first row is a header row in 2D array
    let startIdx = 0;
    if (Array.isArray(rawItems[0]) && typeof rawItems[0][0] === 'string' && (rawItems[0][0].toLowerCase().includes('question') || rawItems[0][0].toLowerCase().includes('q') || rawItems[0][0].toLowerCase().includes('प्रश्न'))) {
      startIdx = 1;
    }

    for (let i = startIdx; i < rawItems.length; i++) {
      const item = rawItems[i];
      if (!item) continue;

      if (Array.isArray(item)) {
        const mrQ = String(item[0] || "").trim();
        const mrA = String(item[1] || "").trim();
        const hiQ = String(item[2] || item[0] || "").trim();
        const hiA = String(item[3] || item[1] || "").trim();
        const enQ = String(item[4] || item[0] || "").trim();
        const enA = String(item[5] || item[1] || "").trim();

        if (mrQ || hiQ || enQ) {
          parsed.push({
            mr: { q: mrQ, a: mrA },
            hi: { q: hiQ, a: hiA },
            en: { q: enQ, a: enA }
          });
        }
      } else if (typeof item === 'object') {
        const keys = Object.keys(item);
        const getVal = (patterns) => {
          for (const p of patterns) {
            const found = keys.find(k => k.trim().toLowerCase().replace(/[^a-z0-9]/g, '') === p);
            if (found && item[found] !== undefined && item[found] !== null && String(item[found]).trim() !== "") {
              return String(item[found]).trim();
            }
          }
          return "";
        };

        const mrQ = getVal(['mrq', 'qmr', 'questionmr', 'mrquestion', 'marathiq', 'q', 'question']) || "";
        const mrA = getVal(['mra', 'amr', 'answermr', 'mranswer', 'marathia', 'a', 'answer']) || "";
        const hiQ = getVal(['hiq', 'qhi', 'questionhi', 'hiquestion', 'hindiq']) || mrQ;
        const hiA = getVal(['hia', 'ahi', 'answerhi', 'hianswer', 'hindia']) || mrA;
        const enQ = getVal(['enq', 'qen', 'questionen', 'enquestion', 'englishq']) || mrQ;
        const enA = getVal(['ena', 'aen', 'answeren', 'enanswer', 'englisha']) || mrA;

        if (mrQ || hiQ || enQ) {
          parsed.push({
            mr: { q: mrQ, a: mrA },
            hi: { q: hiQ, a: hiA },
            en: { q: enQ, a: enA }
          });
        }
      }
    }
    return parsed;
  }

  function initializeUnseenPool() {
    unseenPool = Array.from({ length: questionsData.length }, (_, i) => i);
    for (let i = unseenPool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [unseenPool[i], unseenPool[j]] = [unseenPool[j], unseenPool[i]];
    }
  }

  // Dual-Layer Loader: Attempts direct fetch, automatically falls back to JSONP on CORS/redirect block
  function fetchQuestions() {
    questionEl.textContent = uiTranslations[currentLanguage].loading;
    answerEl.textContent = "-";
    nextBtn.disabled = true;

    // Layer 1: Direct fetch with follow redirects
    fetch(API_URL, { method: "GET", redirect: "follow" })
      .then(res => res.json())
      .then(data => {
        handleRawData(data);
      })
      .catch(err => {
        console.warn("Direct fetch restricted, switching to JSONP request...", err);
        loadJSONP(API_URL);
      });
  }

  function loadJSONP(url) {
    const callbackName = "handleSheetJSONP_" + Math.round(100000 * Math.random());
    window[callbackName] = function(data) {
      delete window[callbackName];
      document.body.removeChild(script);
      handleRawData(data);
    };

    const script = document.createElement("script");
    script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + callbackName;
    script.onerror = function() {
      console.error("JSONP script execution failed.");
      questionEl.textContent = uiTranslations[currentLanguage].error;
      nextBtn.disabled = false;
    };
    document.body.appendChild(script);
  }

  function handleRawData(raw) {
    let list = [];
    if (Array.isArray(raw)) {
      list = raw;
    } else if (raw && typeof raw === 'object') {
      list = raw.data || raw.questions || raw.rows || raw.result || Object.values(raw);
    }

    const parsed = normalizeApiResponse(list);
    if (parsed.length > 0) {
      questionsData = parsed;
      initializeUnseenPool();
      nextBtn.disabled = false;
      nextQuestion();
    } else {
      questionEl.textContent = uiTranslations[currentLanguage].error;
      nextBtn.disabled = false;
    }
  }

  function changeLanguage(lang) {
    if (!uiTranslations[lang]) return;
    currentLanguage = lang;

    langSelect.value = lang;
    document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
    const activeBtn = document.getElementById(`btn-lang-${lang}`);
    if (activeBtn) activeBtn.classList.add("active");

    lblQuestion.textContent = uiTranslations[lang].lblQuestion;
    lblAnswer.textContent = uiTranslations[lang].lblAnswer;
    prevBtn.textContent = uiTranslations[lang].btnPrev;
    showBtn.textContent = uiTranslations[lang].btnShow;
    nextBtn.textContent = uiTranslations[lang].btnNext;
    lblStreak.textContent = uiTranslations[lang].lblStreak;
    if (lblDesignation && uiTranslations[lang].designation) {
      lblDesignation.textContent = uiTranslations[lang].designation;
    }

    if (currentIndex >= 0 && historyStack[currentIndex] !== undefined && questionsData.length > 0) {
      const qIndex = historyStack[currentIndex];
      const qItem = questionsData[qIndex];
      const langData = (qItem && qItem[currentLanguage]) ? qItem[currentLanguage] : (qItem ? qItem.mr : null);
      
      if (langData) {
        questionEl.textContent = langData.q;
        answerEl.textContent = langData.a;
      }
    }
  }

  function displayCurrentQuestion() {
    if (!questionsData || questionsData.length === 0) return;

    const qIndex = historyStack[currentIndex];
    const qItem = questionsData[qIndex];
    const langData = (qItem && qItem[currentLanguage]) ? qItem[currentLanguage] : (qItem ? qItem.mr : { q: "-", a: "-" });

    cardEl.style.transition = "none";
    cardEl.classList.remove("is-flipped");
    
    questionEl.textContent = langData.q;
    answerEl.textContent = langData.a;

    void cardEl.offsetWidth;
    cardEl.style.transition = "transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)";

    prevBtn.disabled = (currentIndex <= 0);
    resetTimer();
  }

  function nextQuestion() {
    if (questionsData.length === 0) return;

    if (currentIndex < historyStack.length - 1) {
      currentIndex++;
    } else {
      if (unseenPool.length === 0) {
        initializeUnseenPool();
        if (historyStack.length > 0 && unseenPool[unseenPool.length - 1] === historyStack[currentIndex]) {
          const top = unseenPool.pop();
          unseenPool.unshift(top);
        }
      }
      const nextIdx = unseenPool.pop();
      historyStack.push(nextIdx);
      currentIndex++;
    }

    displayCurrentQuestion();
  }

  function prevQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      displayCurrentQuestion();
    }
  }

  function flipCard() {
    const isFlipped = cardEl.classList.toggle("is-flipped");

    if (isFlipped) {
      const currentQId = historyStack[currentIndex];
      
      if (!revealedQuestions.has(currentQId)) {
        revealedQuestions.add(currentQId);
        streak++;
        streakEl.textContent = streak;

        if (typeof confetti === "function") {
          confetti({
            particleCount: 45,
            spread: 60,
            origin: { y: 0.7 }
          });
        }
      }

      avatar.classList.add("character-happy");
      avatar.textContent = "🥳";

      setTimeout(() => {
        avatar.classList.remove("character-happy");
        avatar.textContent = "🧑‍🎓";
      }, 1400);
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timer = 60;
    updateTimerUI();

    timerInterval = setInterval(() => {
      timer--;
      updateTimerUI();

      if (timer <= 0) {
        clearInterval(timerInterval);
      }
    }, 1000);
  }

  function updateTimerUI() {
    timerText.textContent = timer;
    const percentage = (timer / 60) * 100;
    timerBar.style.width = percentage + "%";

    if (timer > 30) {
      timerBar.style.backgroundColor = "var(--accent)";
    } else if (timer > 10) {
      timerBar.style.backgroundColor = "var(--warning)";
    } else {
      timerBar.style.backgroundColor = "var(--danger)";
    }
  }

  window.addEventListener("DOMContentLoaded", () => {
    changeLanguage('mr');
    fetchQuestions();
  });
</script>
</body>
</html>
