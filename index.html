<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quizy - Multi-Language Quiz</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #6c5ce7;
      --accent: #00b894;
      --danger: #ff7675;
      --warning: #fdcb6e;
      --prev-btn: #e17055;
      --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(8px, 2.5vw, 24px);
      position: relative;
      overflow-x: hidden;
    }

    /* Background Doodles */
    .bg-doodles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      font-size: clamp(1.8rem, 4vw, 4.5rem);
      opacity: 0.12;
      animation: float 8s infinite ease-in-out;
    }

    .doodle:nth-child(1) { top: 8%; left: 6%; animation-delay: 0s; }
    .doodle:nth-child(2) { top: 78%; left: 8%; animation-delay: 2s; }
    .doodle:nth-child(3) { top: 12%; right: 8%; animation-delay: 4s; }
    .doodle:nth-child(4) { top: 82%; right: 10%; animation-delay: 1s; }
    .doodle:nth-child(5) { top: 45%; left: 3%; animation-delay: 3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(8deg); }
    }

    /* Main Container */
    .app-container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: clamp(16px, 2.5vw, 32px);
      padding: clamp(14px, 2.8vw, 32px);
      width: 100%;
      max-width: 920px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      text-align: center;
      color: white;
      margin: auto;
    }

    /* Language Switcher Bar */
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 14px;
      border-radius: 18px;
      margin-bottom: clamp(10px, 1.8vw, 16px);
    }

    .lang-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: clamp(0.8rem, 1.4vw, 1.05rem);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .lang-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d3b2e;
      box-shadow: 0 0 10px rgba(0, 184, 148, 0.6);
    }

    .lang-dropdown-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.85rem, 1.4vw, 1.05rem);
      font-weight: 600;
    }

    .lang-select {
      background: #1e1b4b;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* App Title */
    .app-title {
      font-size: clamp(1.6rem, 3.8vw, 3rem);
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: clamp(6px, 1.2vw, 12px);
      background: linear-gradient(45deg, #a855f7, #3b82f6, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* Character Animation */
    .character-container {
      width: clamp(60px, 8.5vw, 105px);
      height: clamp(60px, 8.5vw, 105px);
      margin: 0 auto clamp(8px, 1.5vw, 14px) auto;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: clamp(2px, 0.4vw, 4px) solid rgba(255,255,255,0.4);
      animation: pulseCharacter 3s infinite ease-in-out;
      font-size: clamp(2rem, 4.5vw, 3.6rem);
      user-select: none;
    }

    @keyframes pulseCharacter {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .character-happy {
      animation: celebrate 0.6s ease-in-out infinite alternate;
    }

    @keyframes celebrate {
      0% { transform: translateY(0) scale(1.1); }
      100% { transform: translateY(-12px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: clamp(6px, 1.2vw, 14px);
      font-weight: 700;
      font-size: clamp(0.95rem, 1.8vw, 1.45rem);
    }

    .streak-badge {
      background: rgba(255, 255, 255, 0.25);
      padding: clamp(4px, 0.7vw, 7px) clamp(10px, 1.4vw, 16px);
      border-radius: 20px;
      font-size: clamp(0.85rem, 1.6vw, 1.2rem);
    }

    .timer-container {
      width: 100%;
      height: clamp(8px, 1.1vw, 12px);
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin-bottom: clamp(12px, 2.2vw, 22px);
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 10px;
      transition: width 1s linear, background-color 0.5s ease;
    }

    /* 3D Flip Card */
    .card-scene {
      width: 100%;
      min-height: clamp(170px, 24vh, 320px);
      perspective: 1200px;
      margin-bottom: clamp(14px, 2.2vw, 24px);
      cursor: pointer;
    }

    .card {
      width: 100%;
      min-height: clamp(170px, 24vh, 320px);
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: clamp(14px, 2vw, 22px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: clamp(14px, 2vw, 22px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(14px, 2.5vw, 28px);
      background: white;
      color: #2d3436;
      overflow-y: auto;
    }

    .card-front {
      border-bottom: clamp(5px, 0.8vw, 10px) solid var(--primary);
    }

    .card-back {
      background: #f8f9fa;
      transform: rotateY(180deg);
      border-bottom: clamp(5px, 0.8vw, 10px) solid var(--accent);
    }

    .card-label {
      font-size: clamp(0.75rem, 1.3vw, 1.1rem);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8395a7;
      margin-bottom: clamp(6px, 1vw, 12px);
      font-weight: 700;
    }

    .card-text {
      font-size: clamp(1.15rem, 2.6vw, 2.1rem);
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      word-break: break-word;
    }

    .card-back .card-text {
      color: var(--accent);
      font-size: clamp(1.25rem, 3vw, 2.3rem);
    }

    /* Action Buttons */
    .button-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 1.5vw, 16px);
    }

    .btn {
      padding: clamp(10px, 1.5vw, 16px) clamp(6px, 1.2vw, 14px);
      border: none;
      border-radius: clamp(10px, 1.4vw, 14px);
      font-size: clamp(0.85rem, 1.5vw, 1.25rem);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      user-select: none;
    }

    .btn:active { transform: scale(0.96); }
    
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none;
    }

    .btn-prev { background: var(--prev-btn); color: white; }
    .btn-prev:hover:not(:disabled) { background: #d63031; }

    .btn-show { background: var(--accent); color: white; }
    .btn-show:hover { background: #00a182; }

    .btn-next { background: #0984e3; color: white; }
    .btn-next:hover { background: #0773c5; }

    /* Footer Credits */
    .credits-footer {
      margin-top: clamp(12px, 1.8vw, 20px);
      font-size: clamp(0.72rem, 1.2vw, 0.95rem);
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.4;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: clamp(8px, 1.4vw, 14px);
    }

    .credits-footer strong {
      color: #ffffff;
    }

    @media (max-width: 580px) {
      .lang-bar {
        justify-content: center;
      }
      .button-group {
        grid-template-columns: 1fr 1fr;
      }
      .btn-show {
        grid-column: span 2;
        order: -1;
      }
    }

    @media (min-width: 1400px) {
      .app-container {
        max-width: 1050px;
      }
    }
  </style>
</head>
<body>

<div class="bg-doodles">
  <div class="doodle">📚</div>
  <div class="doodle">💡</div>
  <div class="doodle">🎓</div>
  <div class="doodle">✏️</div>
  <div class="doodle">🔬</div>
</div>

<div class="app-container" id="app">
  <!-- Top Language Selector Toolbar -->
  <div class="lang-bar">
    <div class="lang-buttons">
      <button class="lang-btn active" id="btn-lang-mr" onclick="changeLanguage('mr')">मराठी</button>
      <button class="lang-btn" id="btn-lang-hi" onclick="changeLanguage('hi')">हिन्दी</button>
      <button class="lang-btn" id="btn-lang-en" onclick="changeLanguage('en')">English</button>
    </div>
    <div class="lang-dropdown-container">
      <span>🌐</span>
      <select class="lang-select" id="lang-select" onchange="changeLanguage(this.value)">
        <option value="mr" selected>मराठी (Marathi)</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <!-- App Title -->
  <h1 class="app-title">Quizy 🧠</h1>

  <!-- 2D Avatar -->
  <div class="character-container" id="student-avatar">🧑‍🎓</div>

  <div class="header">
    <div>⏱️ <span id="timer-text">60</span>s</div>
    <div class="streak-badge">⚡ <span id="lbl-streak">गुण</span>: <span id="streak">0</span></div>
  </div>

  <div class="timer-container">
    <div class="timer-bar" id="timer-bar"></div>
  </div>

  <!-- 3D Flip Card -->
  <div class="card-scene" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="card-label" id="lbl-question">प्रश्न</div>
        <div class="card-text" id="question">लोड होत आहे...</div>
      </div>
      <div class="card-face card-back">
        <div class="card-label" id="lbl-answer">उत्तर</div>
        <div class="card-text" id="answer">-</div>
      </div>
    </div>
  </div>

  <!-- Navigation Action Buttons -->
  <div class="button-group">
    <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()" disabled>⬅️ मागील प्रश्न</button>
    <button class="btn btn-show" id="btn-show" onclick="flipCard()">👁️ उत्तर पाहा</button>
    <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">पुढील प्रश्न ➡️</button>
  </div>

  <!-- Footer Credits -->
  <div class="credits-footer">
    © <strong>Vrushabh H. Borkar</strong><br>
    <span id="lbl-designation">Graduate Teacher, ZP Upper Primary School, Mohgaon (Tilli)</span>
  </div>
</div>

<script>
  // UI Translations
  const uiTranslations = {
    mr: {
      lblQuestion: "प्रश्न (Question)",
      lblAnswer: "उत्तर (Answer)",
      btnPrev: "⬅️ मागील प्रश्न",
      btnShow: "👁️ उत्तर पाहा",
      btnNext: "पुढील प्रश्न ➡️",
      lblStreak: "गुण",
      loading: "लोड होत आहे..."
    },
    hi: {
      lblQuestion: "प्रश्न (Question)",
      lblAnswer: "उत्तर (Answer)",
      btnPrev: "⬅️ पिछला प्रश्न",
      btnShow: "👁️ उत्तर देखें",
      btnNext: "अगला प्रश्न ➡️",
      lblStreak: "स्कोर",
      loading: "लोड हो रहा है..."
    },
    en: {
      lblQuestion: "Question",
      lblAnswer: "Answer",
      btnPrev: "⬅️ Previous",
      btnShow: "👁️ View Answer",
      btnNext: "Next ➡️",
      lblStreak: "Streak",
      loading: "Loading..."
    }
  };

  // Multilingual Question Bank
  const questionsData = [
    {
      mr: { q: "महाराष्ट्राची उपराजधानी कोणती आहे?", a: "नागपूर" },
      hi: { q: "महाराष्ट्र की उप-राजधानी कौन सी है?", a: "नागपुर" },
      en: { q: "Which city is the sub-capital of Maharashtra?", a: "Nagpur" }
    },
    {
      mr: { q: "सूर्यमालेतील सर्वात मोठा ग्रह कोणता?", a: "गुरु (Jupiter)" },
      hi: { q: "सौरमंडल का सबसे बड़ा ग्रह कौन सा है?", a: "बृहस्पति (Jupiter)" },
      en: { q: "Which is the largest planet in our Solar System?", a: "Jupiter" }
    },
    {
      mr: { q: "मानवी शरीरात एकूण किती हाडे असतात?", a: "२०६" },
      hi: { q: "मानव शरीर में कुल कितनी हड्डियाँ होती हैं?", a: "२०६" },
      en: { q: "How many bones are there in the human body?", a: "206" }
    },
    {
      mr: { q: "भारताचे 'मिसाईल मॅन' कोणाला म्हणतात?", a: "डॉ. ए. पी. जे. अब्दुल कलाम" },
      hi: { q: "भारत का 'मिसाइल मैन' किसे कहा जाता है?", a: "डॉ. ए. पी. जे. अब्दुल कलाम" },
      en: { q: "Who is known as the 'Missile Man of India'?", a: "Dr. A.P.J. Abdul Kalam" }
    },
    {
      mr: { q: "पाण्याचे रासायनिक सूत्र काय आहे?", a: "H₂O" },
      hi: { q: "पानी का रासायनिक सूत्र क्या है?", a: "H₂O" },
      en: { q: "What is the chemical formula of water?", a: "H₂O" }
    },
    {
      mr: { q: "महाराष्ट्रातील सर्वोच्च शिखर कोणते आहे?", a: "कळसूबाई (१६४६ मी)" },
      hi: { q: "महाराष्ट्र का सबसे ऊँचा शिखर कौन सा है?", a: "कलसूबाई (1646 मी)" },
      en: { q: "Which is the highest peak in Maharashtra?", a: "Kalsubai (1646 m)" }
    },
    {
      mr: { q: "भारताचा राष्ट्रीय प्राणी कोणता आहे?", a: "वाघ" },
      hi: { q: "भारत का राष्ट्रीय पशु कौन सा है?", a: "बाघ" },
      en: { q: "What is the national animal of India?", a: "Tiger" }
    },
    {
      mr: { q: "झाडांची पाने हिरवी कशामुळे दिसतात?", a: "हरितद्रव्य (क्लोरोफिल)" },
      hi: { q: "पेड़ों की पत्तियाँ हरी क्यों दिखाई देती हैं?", a: "क्लोरोफिल (हरितलवक)" },
      en: { q: "Why do plant leaves appear green?", a: "Chlorophyll" }
    }
  ];

  // State Variables
  let currentLanguage = 'mr';
  let historyStack = [];
  let currentIndex = -1;
  let timer = 60;
  let timerInterval = null;
  let streak = 0;

  // DOM Elements
  const questionEl = document.getElementById("question");
  const answerEl = document.getElementById("answer");
  const cardEl = document.getElementById("card");
  const timerText = document.getElementById("timer-text");
  const timerBar = document.getElementById("timer-bar");
  const streakEl = document.getElementById("streak");
  const prevBtn = document.getElementById("btn-prev");
  const showBtn = document.getElementById("btn-show");
  const nextBtn = document.getElementById("btn-next");
  const avatar = document.getElementById("student-avatar");
  const langSelect = document.getElementById("lang-select");
  const lblQuestion = document.getElementById("lbl-question");
  const lblAnswer = document.getElementById("lbl-answer");
  const lblStreak = document.getElementById("lbl-streak");

  function changeLanguage(lang) {
    if (!uiTranslations[lang]) return;
    currentLanguage = lang;

    // Update Dropdown
    langSelect.value = lang;

    // Update Language Buttons
    document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
    const activeBtn = document.getElementById(`btn-lang-${lang}`);
    if (activeBtn) activeBtn.classList.add("active");

    // Update Static UI Text
    lblQuestion.textContent = uiTranslations[lang].lblQuestion;
    lblAnswer.textContent = uiTranslations[lang].lblAnswer;
    prevBtn.textContent = uiTranslations[lang].btnPrev;
    showBtn.textContent = uiTranslations[lang].btnShow;
    nextBtn.textContent = uiTranslations[lang].btnNext;
    lblStreak.textContent = uiTranslations[lang].lblStreak;

    // Refresh Current Question in selected language
    if (currentIndex >= 0 && historyStack[currentIndex] !== undefined) {
      const qIndex = historyStack[currentIndex];
      const qData = questionsData[qIndex][currentLanguage];
      questionEl.textContent = qData.q;
      answerEl.textContent = qData.a;
    }
  }

  function displayCurrentQuestion() {
    const qIndex = historyStack[currentIndex];
    const qData = questionsData[qIndex][currentLanguage];

    // Disable transition temporarily to prevent visible flip-back
    cardEl.style.transition = "none";
    cardEl.classList.remove("is-flipped");
    
    // Set question and answer text
    questionEl.textContent = qData.q;
    answerEl.textContent = qData.a;

    // Trigger DOM reflow to apply the un-flipped state immediately
    void cardEl.offsetWidth;

    // Re-enable smooth transition for future card flips
    cardEl.style.transition = "transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)";

    // Toggle Previous Button
    prevBtn.disabled = (currentIndex <= 0);

    resetTimer();
  }

  function nextQuestion() {
    if (currentIndex < historyStack.length - 1) {
      // Step forward in history
      currentIndex++;
    } else {
      // Select new question index without immediate repetition
      let newIndex = Math.floor(Math.random() * questionsData.length);
      if (historyStack.length > 0 && questionsData.length > 1) {
        while (newIndex === historyStack[currentIndex]) {
          newIndex = Math.floor(Math.random() * questionsData.length);
        }
      }
      historyStack.push(newIndex);
      currentIndex++;
    }

    displayCurrentQuestion();
  }

  function prevQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      displayCurrentQuestion();
    }
  }

  function flipCard() {
    const isFlipped = cardEl.classList.toggle("is-flipped");

    if (isFlipped) {
      streak++;
      streakEl.textContent = streak;
      avatar.classList.add("character-happy");
      avatar.textContent = "🥳";

      if (typeof confetti === "function") {
        confetti({
          particleCount: 45,
          spread: 60,
          origin: { y: 0.7 }
        });
      }

      setTimeout(() => {
        avatar.classList.remove("character-happy");
        avatar.textContent = "🧑‍🎓";
      }, 1400);
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timer = 60;
    updateTimerUI();

    timerInterval = setInterval(() => {
      timer--;
      updateTimerUI();

      if (timer <= 0) {
        clearInterval(timerInterval);
      }
    }, 1000);
  }

  function updateTimerUI() {
    timerText.textContent = timer;
    const percentage = (timer / 60) * 100;
    timerBar.style.width = percentage + "%";

    if (timer > 30) {
      timerBar.style.backgroundColor = "var(--accent)";
    } else if (timer > 10) {
      timerBar.style.backgroundColor = "var(--warning)";
    } else {
      timerBar.style.backgroundColor = "var(--danger)";
    }
  }

  // Initialize on page load
