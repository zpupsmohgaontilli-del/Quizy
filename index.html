<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizy - सामान्य ज्ञान</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #6c5ce7;
      --accent: #00b894;
      --danger: #ff7675;
      --warning: #fdcb6e;
      --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(10px, 3vw, 40px);
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Background Doodles */
    .bg-doodles {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      font-size: clamp(2rem, 4vw, 5rem);
      opacity: 0.15;
      animation: float 8s infinite ease-in-out;
    }

    .doodle:nth-child(1) { top: 10%; left: 8%; animation-delay: 0s; }
    .doodle:nth-child(2) { top: 75%; left: 10%; animation-delay: 2s; }
    .doodle:nth-child(3) { top: 15%; right: 10%; animation-delay: 4s; }
    .doodle:nth-child(4) { top: 80%; right: 12%; animation-delay: 1s; }
    .doodle:nth-child(5) { top: 45%; left: 4%; animation-delay: 3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    /* Main Responsive Container */
    .app-container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: clamp(20px, 3vw, 40px);
      padding: clamp(20px, 4vw, 50px);
      width: 95%;
      max-width: 900px; /* Scales broad on IFP screens */
      box-shadow: 0 25px 60px rgba(0,0,0,0.45);
      text-align: center;
      color: white;
    }

    /* App Title Header */
    .app-title {
      font-size: clamp(2rem, 5vw, 3.8rem);
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: clamp(10px, 2vw, 20px);
      background: linear-gradient(45deg, #a855f7, #3b82f6, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* 2D Student Character Animation */
    .character-container {
      width: clamp(80px, 12vw, 150px);
      height: clamp(80px, 12vw, 150px);
      margin: 0 auto clamp(10px, 2vw, 20px) auto;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: clamp(3px, 0.5vw, 6px) solid rgba(255,255,255,0.4);
      animation: pulseCharacter 3s infinite ease-in-out;
      font-size: clamp(2.5rem, 6vw, 5rem);
      user-select: none;
    }

    @keyframes pulseCharacter {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .character-happy {
      animation: celebrate 0.6s ease-in-out infinite alternate;
    }

    @keyframes celebrate {
      0% { transform: translateY(0) scale(1.1); }
      100% { transform: translateY(-15px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: clamp(12px, 2vw, 20px);
      font-weight: 700;
      font-size: clamp(1.1rem, 2.5vw, 2rem);
    }

    .streak-badge {
      background: rgba(255, 255, 255, 0.25);
      padding: clamp(6px, 1vw, 12px) clamp(12px, 2vw, 24px);
      border-radius: 30px;
      font-size: clamp(0.9rem, 2vw, 1.6rem);
    }

    .timer-container {
      width: 100%;
      height: clamp(10px, 1.5vw, 18px);
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      margin-bottom: clamp(20px, 3vw, 35px);
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 12px;
      transition: width 1s linear, background-color 0.5s ease;
    }

    /* 3D Flip Card */
    .card-scene {
      width: 100%;
      min-height: clamp(220px, 32vh, 420px);
      perspective: 1200px;
      margin-bottom: clamp(20px, 3vw, 35px);
      cursor: pointer;
    }

    .card {
      width: 100%;
      min-height: clamp(220px, 32vh, 420px);
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: clamp(16px, 2.5vw, 30px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: clamp(16px, 2.5vw, 30px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(20px, 3.5vw, 40px);
      background: white;
      color: #2d3436;
    }

    .card-front {
      border-bottom: clamp(6px, 1vw, 12px) solid var(--primary);
    }

    .card-back {
      background: #f8f9fa;
      transform: rotateY(180deg);
      border-bottom: clamp(6px, 1vw, 12px) solid var(--accent);
    }

    .card-label {
      font-size: clamp(0.85rem, 1.8vw, 1.4rem);
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #8395a7;
      margin-bottom: clamp(10px, 1.5vw, 20px);
      font-weight: 700;
    }

    .card-text {
      font-size: clamp(1.4rem, 3.5vw, 2.8rem);
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }

    .card-back .card-text {
      color: var(--accent);
      font-size: clamp(1.6rem, 4vw, 3.2rem);
    }

    /* Action Buttons */
    .button-group {
      display: flex;
      gap: clamp(10px, 2vw, 24px);
    }

    .btn {
      flex: 1;
      padding: clamp(14px, 2.2vw, 24px) clamp(16px, 2.5vw, 30px);
      border: none;
      border-radius: clamp(12px, 2vw, 20px);
      font-size: clamp(1.1rem, 2.2vw, 2rem);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:active { transform: scale(0.96); }

    .btn-show { background: #00b894; color: white; }
    .btn-show:hover { background: #00a182; }

    .btn-next { background: #0984e3; color: white; }
    .btn-next:hover { background: #0773c5; }

    /* Footer Credits */
    .credits-footer {
      margin-top: clamp(20px, 3vw, 35px);
      font-size: clamp(0.85rem, 1.8vw, 1.4rem);
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.5;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      padding-top: clamp(12px, 2vw, 20px);
    }

    .credits-footer strong {
      color: #ffffff;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .shake { animation: shake 0.5s ease-in-out; }

    /* Extra Scaling for Giant Screens (IFP / Smart TVs > 1400px width) */
    @media (min-width: 1400px) {
      .app-container {
        max-width: 1100px;
      }
    }
  </style>
</head>
<body>

<!-- Animated background doodles -->
<div class="bg-doodles">
  <div class="doodle">📚</div>
  <div class="doodle">💡</div>
  <div class="doodle">🎓</div>
  <div class="doodle">✏️</div>
  <div class="doodle">🔬</div>
</div>

<div class="app-container" id="app">
  <!-- App Title -->
  <h1 class="app-title">Quizy 🧠</h1>

  <!-- 2D Student Avatar -->
  <div class="character-container" id="student-avatar">
    🧑‍🎓
  </div>

  <div class="header">
    <div>⏱️ <span id="timer-text">60</span>s</div>
    <div class="streak-badge">⚡ Streak: <span id="streak">0</span></div>
  </div>

  <div class="timer-container">
    <div class="timer-bar" id="timer-bar"></div>
  </div>

  <!-- 3D Flip Card -->
  <div class="card-scene" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="card-label">प्रश्न (Question)</div>
        <div class="card-text" id="question">लोड होत आहे...</div>
      </div>
      <div class="card-face card-back">
        <div class="card-label">उत्तर (Answer)</div>
        <div class="card-text" id="answer">-</div>
      </div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="button-group">
    <button class="btn btn-show" onclick="flipCard()">👁️ उत्तर पाहा</button>
    <button class="btn btn-next" onclick="nextQuestion()">🎲 पुढील प्रश्न</button>
  </div>

  <!-- Credits Footer -->
  <div class="credits-footer">
    © <strong>Vrushabh H. Borkar</strong><br>
    Graduate Teacher, ZP Upper Primary School, Mohgaon (Tilli)
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
