<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quizy - सामान्य ज्ञान</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #6c5ce7;
      --accent: #00b894;
      --danger: #ff7675;
      --warning: #fdcb6e;
      --prev-btn: #e17055;
      --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(8px, 2.5vw, 30px);
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Background Doodles */
    .bg-doodles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      font-size: clamp(1.8rem, 4vw, 4.5rem);
      opacity: 0.12;
      animation: float 8s infinite ease-in-out;
    }

    .doodle:nth-child(1) { top: 8%; left: 6%; animation-delay: 0s; }
    .doodle:nth-child(2) { top: 78%; left: 8%; animation-delay: 2s; }
    .doodle:nth-child(3) { top: 12%; right: 8%; animation-delay: 4s; }
    .doodle:nth-child(4) { top: 82%; right: 10%; animation-delay: 1s; }
    .doodle:nth-child(5) { top: 45%; left: 3%; animation-delay: 3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(8deg); }
    }

    /* Main Responsive Container */
    .app-container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: clamp(16px, 2.5vw, 36px);
      padding: clamp(16px, 3vw, 40px);
      width: 100%;
      max-width: 960px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      text-align: center;
      color: white;
      margin: auto;
    }

    /* App Title Header */
    .app-title {
      font-size: clamp(1.6rem, 4vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: clamp(6px, 1.2vw, 14px);
      background: linear-gradient(45deg, #a855f7, #3b82f6, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* 2D Student Character Animation */
    .character-container {
      width: clamp(60px, 9vw, 120px);
      height: clamp(60px, 9vw, 120px);
      margin: 0 auto clamp(8px, 1.5vw, 16px) auto;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: clamp(2px, 0.4vw, 5px) solid rgba(255,255,255,0.4);
      animation: pulseCharacter 3s infinite ease-in-out;
      font-size: clamp(2rem, 5vw, 4rem);
      user-select: none;
    }

    @keyframes pulseCharacter {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .character-happy {
      animation: celebrate 0.6s ease-in-out infinite alternate;
    }

    @keyframes celebrate {
      0% { transform: translateY(0) scale(1.1); }
      100% { transform: translateY(-12px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: clamp(8px, 1.5vw, 16px);
      font-weight: 700;
      font-size: clamp(0.95rem, 2vw, 1.6rem);
    }

    .streak-badge {
      background: rgba(255, 255, 255, 0.25);
      padding: clamp(4px, 0.8vw, 8px) clamp(10px, 1.5vw, 18px);
      border-radius: 24px;
      font-size: clamp(0.85rem, 1.8vw, 1.3rem);
    }

    .timer-container {
      width: 100%;
      height: clamp(8px, 1.2vw, 14px);
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin-bottom: clamp(14px, 2.5vw, 26px);
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 10px;
      transition: width 1s linear, background-color 0.5s ease;
    }

    /* 3D Flip Card */
    .card-scene {
      width: 100%;
      min-height: clamp(170px, 26vh, 360px);
      perspective: 1200px;
      margin-bottom: clamp(16px, 2.5vw, 28px);
      cursor: pointer;
    }

    .card {
      width: 100%;
      min-height: clamp(170px, 26vh, 360px);
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: clamp(14px, 2vw, 24px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: clamp(14px, 2vw, 24px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(14px, 2.5vw, 30px);
      background: white;
      color: #2d3436;
      overflow-y: auto;
    }

    .card-front {
      border-bottom: clamp(5px, 0.8vw, 10px) solid var(--primary);
    }

    .card-back {
      background: #f8f9fa;
      transform: rotateY(180deg);
      border-bottom: clamp(5px, 0.8vw, 10px) solid var(--accent);
    }

    .card-label {
      font-size: clamp(0.75rem, 1.4vw, 1.15rem);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8395a7;
      margin-bottom: clamp(6px, 1vw, 12px);
      font-weight: 700;
    }

    .card-text {
      font-size: clamp(1.15rem, 2.8vw, 2.2rem);
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      word-break: break-word;
    }

    .card-back .card-text {
      color: var(--accent);
      font-size: clamp(1.25rem, 3.2vw, 2.5rem);
    }

    /* Action Buttons */
    .button-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 1.5vw, 16px);
    }

    .btn {
      padding: clamp(10px, 1.6vw, 18px) clamp(8px, 1.5vw, 16px);
      border: none;
      border-radius: clamp(10px, 1.5vw, 16px);
      font-size: clamp(0.9rem, 1.6vw, 1.35rem);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-prev { background: var(--prev-btn); color: white; }
    .btn-prev:hover:not(:disabled) { background: #d63031; }

    .btn-show { background: var(--accent); color: white; }
    .btn-show:hover { background: #00a182; }

    .btn-next { background: #0984e3; color: white; }
    .btn-next:hover { background: #0773c5; }

    /* Footer Credits */
    .credits-footer {
      margin-top: clamp(14px, 2vw, 24px);
      font-size: clamp(0.75rem, 1.3vw, 1.05rem);
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.4;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: clamp(10px, 1.5vw, 16px);
    }

    .credits-footer strong {
      color: #ffffff;
    }

    /* Small Mobile Specific Adjustments */
    @media (max-width: 540px) {
      .button-group {
        grid-template-columns: 1fr 1fr;
      }
      .btn-show {
        grid-column: span 2;
        order: -1;
      }
    }

    /* Large Interactive Screens / Displays */
    @media (min-width: 1400px) {
      .app-container {
        max-width: 1100px;
      }
    }
  </style>
</head>
<body>

<!-- Animated background doodles -->
<div class="bg-doodles">
  <div class="doodle">📚</div>
  <div class="doodle">💡</div>
  <div class="doodle">🎓</div>
  <div class="doodle">✏️</div>
  <div class="doodle">🔬</div>
</div>

<div class="app-container" id="app">
  <!-- App Title -->
  <h1 class="app-title">Quizy 🧠</h1>

  <!-- 2D Student Avatar -->
  <div class="character-container" id="student-avatar">
    🧑‍🎓
  </div>

  <div class="header">
    <div>⏱️ <span id="timer-text">60</span>s</div>
    <div class="streak-badge">⚡ Streak: <span id="streak">0</span></div>
  </div>

  <div class="timer-container">
    <div class="timer-bar" id="timer-bar"></div>
  </div>

  <!-- 3D Flip Card -->
  <div class="card-scene" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="card-label">प्रश्न (Question)</div>
        <div class="card-text" id="question">लोड होत आहे...</div>
      </div>
      <div class="card-face card-back">
        <div class="card-label">उत्तर (Answer)</div>
        <div class="card-text" id="answer">-</div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="button-group">
    <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()" disabled>⬅️ मागील प्रश्न</button>
    <button class="btn btn-show" onclick="flipCard()">👁️ उत्तर पाहा</button>
    <button class="btn btn-next" onclick="nextQuestion()">पुढील प्रश्न ➡️</button>
  </div>

  <!-- Credits Footer -->
  <div class="credits-footer">
    © <strong>Vrushabh H. Borkar</strong><br>
    Graduate Teacher, ZP Upper Primary School, Mohgaon (Tilli)
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
